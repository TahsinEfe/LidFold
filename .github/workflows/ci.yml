name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Needs a toolchain new enough for the concurrency features the app layer uses.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      # The render checks need a GPU and the shader compiler, so they are not run here.
      # Scripts/check.sh covers them locally.
